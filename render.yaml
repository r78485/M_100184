databases:
  - name: edumanage-db
    databaseName: edumanage
    user: edumanage_user
    plan: free

services:
  - type: web
    name: edumanage-web
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn school_management.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edumanage-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
