{% extends 'base.html' %}

{% block title %}Homework Hub - EduManage ERP{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h2 class="fw-bold mb-1" style="color: var(--primary-blue);">Homework & Assignments</h2>
            <p class="text-muted">Publish student assignments, define submission dates, and track file uploads.</p>
        </div>
        <button class="btn text-white rounded-pill px-4" style="background-color: var(--secondary-purple); border: none;" data-bs-toggle="modal" data-bs-target="#hwModal">
            <i class="bi bi-plus-lg me-2"></i>Publish Homework
        </button>
    </div>

    <!-- Homework Cards -->
    <div class="row g-4" id="homeworkGrid">
        <!-- Dynamic -->
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="hwModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 14px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Publish Homework</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="hwForm" onsubmit="saveHomework(event)">
                <div class="modal-body py-3">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Homework Title</label>
                        <input type="text" class="form-control" id="hwTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Class</label>
                        <select class="form-select" id="hwClass" required>
                            <option>Class 6</option>
                            <option>Class 7</option>
                            <option>Class 8</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Submission Deadline</label>
                        <input type="date" class="form-control" id="hwDue" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Task Instructions</label>
                        <textarea class="form-control" rows="3" id="hwDesc" required></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn text-white rounded-pill px-4" style="background-color: var(--primary-blue); border: none;">Publish Task</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const defaultHw = [
        { id: 1, title: "Algebra Worksheet #4", cls: "Class 8", due: "2026-07-22", desc: "Solve all problems on linear equations in page 42-43. Scan work as PDF." },
        { id: 2, title: "English Essay Writing", cls: "Class 7", due: "2026-07-25", desc: "Write a 300-word essay detailing your summer vacation activities." }
    ];

    function getHw() {
        const stored = localStorage.getItem('school_hw');
        if (!stored) {
            localStorage.setItem('school_hw', JSON.stringify(defaultHw));
            return defaultHw;
        }
        return JSON.parse(stored);
    }

    function renderHw() {
        const hws = getHw();
        const grid = document.getElementById('homeworkGrid');
        grid.innerHTML = '';

        hws.forEach(h => {
            grid.insertAdjacentHTML('beforeend', `
                <div class="col-md-6">
                    <div class="card custom-card p-4">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge bg-primary-subtle text-primary rounded-pill px-2.5">${h.cls}</span>
                            <small class="text-danger fw-semibold">Due: ${h.due}</small>
                        </div>
                        <h5 class="fw-bold text-dark">${h.title}</h5>
                        <p class="text-muted small mb-3">${h.desc}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">Assigned by: Mr. Henderson</small>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteHw(${h.id})"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                </div>
            `);
        });
    }

    function saveHomework(event) {
        event.preventDefault();
        const title = document.getElementById('hwTitle').value;
        const cls = document.getElementById('hwClass').value;
        const due = document.getElementById('hwDue').value;
        const desc = document.getElementById('hwDesc').value;

        const hws = getHw();
        hws.push({ id: Date.now(), title, cls, due, desc });
        localStorage.setItem('school_hw', JSON.stringify(hws));
        
        bootstrap.Modal.getInstance(document.getElementById('hwModal')).hide();
        document.getElementById('hwForm').reset();
        renderHw();
    }

    function deleteHw(id) {
        if (confirm("Delete this task?")) {
            let hws = getHw();
            hws = hws.filter(h => h.id !== id);
            localStorage.setItem('school_hw', JSON.stringify(hws));
            renderHw();
        }
    }

    document.addEventListener("DOMContentLoaded", renderHw);
</script>
{% endblock %}
